<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Productos</title>
  <link rel="stylesheet" href="style.css">
  <style>

  </style>
</head>

<body>
  <div class="container">

    <header id="header"></header>

    <div id="summary" class="summary"></div>

    <section id="productList" class="products"></section>

    <footer id="footer"></footer>
  </div>

  <script>
    const catalogo = {
      tienda: "Super Web Store",
      productos: [
        {id: 1, nombre: "Auriculares Bluetooth X200", descripcion: "Auriculares inalámbricos con cancelación parcial de ruido.", precio: 49.99, disponible: true},
        {id: 2, nombre: "Teclado mecánico TKL", descripcion: "Compacto, switches táctiles y retroiluminación RGB.", precio: 79.5, disponible: true},
        {id: 3, nombre: "Ratón ergonómico Pro", descripcion: "Diseño vertical para reducir tensión en la muñeca.", precio: 39.0, disponible: false},
        {id: 4, nombre: "Monitor 24\" 1080p", descripcion: "120Hz, panel IPS y soporte ajustable.", precio: 129.95, disponible: true},
        {id: 5, nombre: "Cable USB-C 2m", descripcion: "Carga rápida y transferencia de datos.", precio: 9.99, disponible: true}
      ],
      ventasMensuales: [120, 150, 95, 180, 160, 200]
    };

    const { tienda, productos, ventasMensuales } = catalogo;

    function pintarCabecera() {
      document.getElementById("header").innerHTML =
        "<div><h1>" + tienda + "</h1>" +
        "<p>Catálogo dinámico generado desde un objeto literal usando innerHTML</p></div>" +
        "<button id='botonOrdenar'>Ordenar por precio: asc</button>";
    }

    function crearTarjeta({ nombre, descripcion, precio, disponible }) {
      const estado = disponible
        ? "<p class='disponible'>Disponible</p>"
        : "<p class='agotado'>Agotado</p>";

      return "<article class='card'>" +
        "<h3>" + nombre + "</h3>" +
        "<p>" + descripcion + "</p>" +
        "<p class='precio'>€ " + precio.toFixed(2) + "</p>" +
        estado +
        "</article>";
    }

    function pintarProductos() {
      const ordenados = [...productos].sort((a, b) => a.precio - b.precio);
      document.getElementById("productList").innerHTML =
        ordenados.map(crearTarjeta).join("");
    }

    function pintarResumen() {
      const total = ventasMensuales.reduce((a, b) => a + b, 0);
      const media = total / ventasMensuales.length;
      const mayor = Math.max(...ventasMensuales);
      const menor = Math.min(...ventasMensuales);
      const mesMayor = ventasMensuales.indexOf(mayor) + 1;
      const mesMenor = ventasMensuales.indexOf(menor) + 1;
      const sumaPrecios = productos.reduce((a, p) => a + p.precio, 0);

      document.getElementById("summary").innerHTML =
        "<div><strong>Total ventas (últimos 6 meses):</strong><br>" + total + " unidades</div>" +
        "<div><strong>Media mensual:</strong><br>" + media.toFixed(2) + " unidades</div>" +
        "<div><strong>Mes con mayor venta:</strong><br>Mes " + mesMayor + " — " + mayor + " unidades</div>" +
        "<div><strong>Mes con menor venta:</strong><br>Mes " + mesMenor + " — " + menor + " unidades</div>" +
        "<div><strong>Suma precios productos:</strong><br>€ " + sumaPrecios.toFixed(2) + "</div>";
    }

    pintarCabecera();
    pintarProductos();
    pintarResumen();
  </script>
</body>

</html>
